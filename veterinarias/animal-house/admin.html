<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Animal house</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
h1{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:#8b93a1;font-size:13px;margin-bottom:26px}
.box{background:#14171d;border:1px solid #232833;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#7c8494;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e222b}
.row:last-child{border:0}
.row .n{flex:1;font-size:14px}
input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Animal house</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "animal-house", "nombre": "Animal house", "tipo": "Veterinaria y pet shop", "rating": "4.7", "direccion": "Benito Rebolledo 2957, Macul", "telefono": "56931814516", "wa_display": "+56 9 3181 4516", "minutos": "Recoge hoy", "prioridad": "B", "horarios": {"lun": [9.5, 19.5], "mar": [9.5, 19.5], "mie": [9.5, 19.5], "jue": [9.5, 19.5], "vie": [9.5, 20], "sab": [10, 14.5], "dom": null}, "tema": {"bg": "#0f1110", "card": "#181c1a", "acento": "#6fbf9a", "acento2": "#a9dcc4", "texto": "#f0f6f2", "fuente": "Anton", "hero": "https://images.unsplash.com/photo-1561037404-61cd46aa615b?w=1400&q=70"}, "lema": "De la consulta a la prevención, todo con la misma gente", "categorias": [{"n": "Alimentos", "items": [{"n": "Alimento natural perro 14 kg", "d": "Ingredientes seleccionados, sin granos", "p": 43290, "tag": "Nuevo"}, {"n": "Alimento gato kitten 2 kg", "d": "Para cachorros de 2 a 12 meses", "p": 17290}, {"n": "Ración húmeda perro (pack 8)", "d": "Carne y vegetales en gelatina", "p": 13890}, {"n": "Premio de pollo deshidratado 300 g", "d": "Snack crocante, ideal para adiestrar", "p": 8190}, {"n": "Agua con sabor para gatos", "d": "Hidratación extra, 500 ml", "p": 5990, "tag": "Recomendado"}]}, {"n": "Premios y juguetes", "items": [{"n": "Hueso de cuero trenzado", "d": "Chew duradero, tamaño M", "p": 5190}, {"n": "Pelota rebotadora", "d": "Caucho no tóxico", "p": 6090, "tag": "Juguete"}, {"n": "Ratón con catnip", "d": "Para gatos, pack de 3", "p": 6390}, {"n": "Cuerda con nudos", "d": "Para tirar, algodón natural", "p": 4690}, {"n": "Premio de entrenamiento (200 g)", "d": "Bocadillos suaves, bajo en grasa", "p": 6090, "tag": "Recomendado"}]}, {"n": "Baños y estética", "items": [{"n": "Baño completo", "d": "Champú según tipo de pelo, secado", "p": 16890, "tag": "Servicio"}, {"n": "Baño y corte de pelo", "d": "Para razas de pelo largo", "p": 24290}, {"n": "Limpieza de oídos", "d": "Prevención de infecciones", "p": 5190}, {"n": "Deslanado", "d": "Durante la muda de pelo", "p": 9490}]}, {"n": "Aseo y accesorios", "items": [{"n": "Baño y corte", "d": "Incluye cepillado y limpieza de oídos", "p": 19290, "tag": "Servicio"}, {"n": "Baño antipulgas", "d": "Shampoo medicado, secado incluido", "p": 20490}, {"n": "Cepillado profundo", "d": "Perros de pelo largo", "p": 11790}, {"n": "Cama antimotines", "d": "Talla S–L, funda lavable", "p": 25790}, {"n": "Correa retráctil 5 m", "d": "Con freno, hasta 50 kg", "p": 12090}]}, {"n": "Farmacia", "items": [{"n": "Desparasitante interno", "d": "Tableta según peso, 1 dosis", "p": 10090, "tag": "Trimestral"}, {"n": "Antipulgas y garrapatas", "d": "Pipeta mensual, perro 10–20 kg", "p": 17690}, {"n": "Vitamina multivitamínica", "d": "Jarabe 250 ml", "p": 7990}, {"n": "Suplemento articular", "d": "Colágeno y condroitina, 60 tabletas", "p": 17990}, {"n": "Antibiótico inyectable", "d": "Venta con indicación veterinaria", "p": 12790}]}]};
const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
