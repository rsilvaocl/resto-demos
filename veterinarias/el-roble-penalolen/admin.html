<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Veterinaria el Roble Peñalolen</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}

input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Veterinaria el Roble Peñalolen</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "el-roble-penalolen", "nombre": "Veterinaria el Roble Peñalolen", "tipo": "Veterinaria de barrio", "rating": "3.9", "direccion": "Av. Consistorial, Peñalolén", "telefono": "", "wa_display": "", "minutos": "Recoge hoy", "prioridad": "B", "horarios": {"lun": [9.5, 19.5], "mar": [9.5, 19.5], "mie": [9.5, 19.5], "jue": [9.5, 19.5], "vie": [9.5, 20], "sab": [10, 14.5], "dom": null}, "tema": {"bg": "#16110f", "card": "#211917", "acento": "#c97e5d", "acento2": "#eab894", "texto": "#f8f0ea", "fuente": "Cormorant Garamond", "hero": "https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=1400&q=70"}, "lema": "Veterinaria de confianza, con turnos sin espera", "categorias": [{"n": "Alimentos", "items": [{"n": "Alimento natural perro 14 kg", "d": "Ingredientes seleccionados, sin granos", "p": 46790, "tag": "Nuevo"}, {"n": "Alimento gato kitten 2 kg", "d": "Para cachorros de 2 a 12 meses", "p": 18690}, {"n": "Ración húmeda perro (pack 8)", "d": "Carne y vegetales en gelatina", "p": 12890}, {"n": "Premio de pollo deshidratado 300 g", "d": "Snack crocante, ideal para adiestrar", "p": 8390}, {"n": "Agua con sabor para gatos", "d": "Hidratación extra, 500 ml", "p": 6190, "tag": "Recomendado"}]}, {"n": "Farmacia", "items": [{"n": "Desparasitante péptico", "d": "Suspensión oral según peso", "p": 12390, "tag": "Mensual"}, {"n": "Antipulgas gato (3 dosis)", "d": "Aplicación tópica, efecto 3 meses", "p": 18590}, {"n": "Protector gástrico", "d": "Pastillas, para perros sensibles", "p": 13090}, {"n": "Omega 3 para pelo y piel", "d": "Cápsulas, 60 unidades", "p": 14890, "tag": "Recomendado"}, {"n": "Suero de rehidratación", "d": "Bolsa 1 litro, con electrolitos", "p": 8490}]}, {"n": "Servicios clínicos", "items": [{"n": "Consulta general", "d": "Diagnóstico y plan de cuidado", "p": 18590, "tag": "Turno"}, {"n": "Vacuna antirrábica", "d": "Perro o gato, con certificado", "p": 16090, "tag": "Obligatoria"}, {"n": "Vacuna triple felina", "d": "Refuerzo anual", "p": const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
