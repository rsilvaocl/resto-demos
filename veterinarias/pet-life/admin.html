<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Veterinaria Pet Life</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
h1{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:#8b93a1;font-size:13px;margin-bottom:26px}
.box{background:#14171d;border:1px solid #232833;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#7c8494;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e222b}
.row:last-child{border:0}
.row .n{flex:1;font-size:14px}
input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Veterinaria Pet Life</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "pet-life", "nombre": "Veterinaria Pet Life", "tipo": "Veterinaria y pet shop", "rating": "4.7", "direccion": "Av. Macul 4676, Macul", "telefono": "56987528794", "wa_display": "+56 9 8752 8794", "minutos": "Recoge hoy", "prioridad": "B", "horarios": {"lun": [9.5, 19.5], "mar": [9.5, 19.5], "mie": [9.5, 19.5], "jue": [9.5, 19.5], "vie": [9.5, 20], "sab": [10, 14.5], "dom": null}, "tema": {"bg": "#14100e", "card": "#1f1815", "acento": "#d4a373", "acento2": "#e9c46a", "texto": "#f5efe9", "fuente": "Playfair Display", "hero": "https://images.unsplash.com/photo-1535930891776-0c2dfb7fda1a?w=1400&q=70"}, "lema": "Consulta, vacunas y todo el cuidado en un solo lugar", "categorias": [{"n": "Alimentos", "items": [{"n": "Alimento perro adulto 15 kg", "d": "Pollo y arroz, bolsa sellada", "p": 35690, "tag": "Más pedido"}, {"n": "Alimento gato esterilizado 7,5 kg", "d": "Control de peso con taurina", "p": 29890}, {"n": "Cachorro crecimiento 10 kg", "d": "DHA para desarrollo", "p": 37390}, {"n": "Comida húmeda gato (pack 12)", "d": "Atún y pollo en salsa", "p": 13690}, {"n": "Snack dental perro", "d": "Reduce el sarro, unidad grande", "p": 6890, "tag": "Recomendado"}]}, {"n": "Premios y juguetes", "items": [{"n": "Hueso de cuero trenzado", "d": "Chew duradero, tamaño M", "p": 5290}, {"n": "Pelota rebotadora", "d": "Caucho no tóxico", "p": 6290, "tag": "Juguete"}, {"n": "Ratón con catnip", "d": "Para gatos, pack de 3", "p": 6090}, {"n": "Cuerda con nudos", "d": "Para tirar, algodón natural", "p": 4690}, {"n": "Premio de entrenamiento (200 g)", "d": "Bocadillos suaves, bajo en grasa", "p": 5890, "tag": "Recomendado"}]}, {"n": "Baños y estética", "items": [{"n": "Baño completo", "d": "Champú según tipo de pelo, secado", "p": 14790, "tag": "Servicio"}, {"n": "Baño y corte de pelo", "d": "Para razas de pelo largo", "p": 21590}, {"n": "Limpieza de oídos", "d": "Prevención de infecciones", "p": 5790}, {"n": "Deslanado", "d": "Durante la muda de pelo", "p": 9490}]}, {"n": "Aseo y accesorios", "items": [{"n": "Baño a domicilio", "d": "Llevamos el equipo a su casa", "p": 22990, "tag": "Servicio"}, {"n": "Corte de uñas y raspado de glándulas", "d": "Mantenimiento completo", "p": 8790}, {"n": "Perfume y desenredo", "d": "Para salón o salidas", "p": 6390}, {"n": "Mochila transportadora", "d": "Certificada para viaje en avión", "p": 38390}, {"n": "Comedero antivoracidad", "d": "Lento, para perros ansiosos", "p": 10890}]}, {"n": "Farmacia", "items": [{"n": "Desparasitante péptico", "d": "Suspensión oral según peso", "p": 12990, "tag": "Mensual"}, {"n": "Antipulgas gato (3 dosis)", "d": "Aplicación tópica, efecto 3 meses", "p": 17090}, {"n": "Protector gástrico", "d": "Pastillas, para perros sensibles", "p": 13990}, {"n": "Omega 3 para pelo y piel", "d": "Cápsulas, 60 unidades", "p": 15390, "tag": "Recomendado"}, {"n": "Suero de rehidratación", "d": "Bolsa 1 litro, con electrolitos", "p": 7590}]}]};
const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
