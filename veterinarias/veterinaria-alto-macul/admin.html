<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Clínica Veterinaria Alto Macul</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
h1{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:#8b93a1;font-size:13px;margin-bottom:26px}
.box{background:#14171d;border:1px solid #232833;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#7c8494;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e222b}
.row:last-child{border:0}
.row .n{flex:1;font-size:14px}
input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Clínica Veterinaria Alto Macul</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "veterinaria-alto-macul", "nombre": "Clínica Veterinaria Alto Macul", "tipo": "Clínica veterinaria", "rating": "4.3", "direccion": "Av. Macul 4370, Macul", "telefono": "", "wa_display": "", "minutos": "Recoge hoy", "prioridad": "B", "horarios": {"lun": [9.5, 19.5], "mar": [9.5, 19.5], "mie": [9.5, 19.5], "jue": [9.5, 19.5], "vie": [9.5, 20], "sab": [10, 14.5], "dom": null}, "tema": {"bg": "#10120e", "card": "#1a1e15", "acento": "#8fae6b", "acento2": "#cfe0b3", "texto": "#f2f6ed", "fuente": "Archivo Black", "hero": "https://images.unsplash.com/photo-1477884213360-7e9d7dcc1e48?w=1400&q=70"}, "lema": "Atención veterinaria de barrio, con trato de casa", "categorias": [{"n": "Alimentos", "items": [{"n": "Alimento perro sensibles 12 kg", "d": "Salmón y papas, sin colorantes", "p": 45890, "tag": "Top"}, {"n": "Alimento gato sterilized 10 kg", "d": "Fórmula completa, con biotina", "p": 38890}, {"n": "Snack de carne seca 500 g", "d": "Cerdo deshidratado, sin conservantes", "p": 9390}, {"n": "Pienso senior perro 12 kg", "d": "Para mayores de 7 años", "p": 38490}, {"n": "Brochetas de atún (pack 6)", "d": "Premio individual para gato", "p": 7690}]}, {"n": "Farmacia", "items": [{"n": "Desparasitante interno", "d": "Tableta según peso, 1 dosis", "p": 10490, "tag": "Trimestral"}, {"n": "Antipulgas y garrapatas", "d": "Pipeta mensual, perro 10–20 kg", "p": 15690}, {"n": "Vitamina multivitamínica", "d": "Jarabe 250 ml", "p": 9290}, {"n": "Suplemento articular", "d": "Colágeno y condroitina, 60 tabletas", "p": 17890}, {"n": "Antibiótico inyectable", "d": "Venta con indicación veterinaria", "p": 13190}]}, {"n": "Aseo y accesorios", "items": [{"n": "Baño y corte", "d": "Incluye cepillado y limpieza de oídos", "p": 19290, "tag": "Servicio"}, {"n": "Baño antipulgas", "d": "Shampoo medicado, secado incluido", "p": 23090}, {"n": "Cepillado profundo", "d": "Perros de pelo largo", "p": 11790}, {"n": "Cama antimotines", "d": "Talla S–L, funda lavable", "p": 22890}, {"n": "Correa retráctil 5 m", "d": "Con freno, hasta 50 kg", "p": 12490}]}, {"n": "Servicios clínicos", "items": [{"n": "Consulta veterinaria", "d": "Examen completo y control general", "p": 19590, "tag": "Turno"}, {"n": "Vacuna múltiple canina", "d": "Primera o refuerzo anual", "p": 18590}, {"n": "Vacuna triple felina", "d": "Refuerzo anual", "p": 15390}, {"n": "Vacuna antirrábica", "d": "Obligatoria, con certificado", "p": 14390, "tag": "Obligatoria"}, {"n": "Esterilización", "d": "Incluye prequirúrgico y control", "p": 137290}, {"n": "Limpieza dental", "d": "Con anestesia y control post", "p": 55590}, {"n": "Corte de uñas", "d": "Incluye revisión de patas", "p": 5690}]}, {"n": "Nutrición y dietas", "items": [{"n": "Consulta de nutrición", "d": "Plan de alimentación según peso", "p": 15390, "tag": "Plan"}, {"n": "Alimento de prescripción renal", "d": "Bolsa 8 kg, con receta", "p": 50690}, {"n": "Alimento de prescripción urinario", "d": "Bolsa 8 kg, con receta", "p": 47290}, {"n": "Snack bajo en calorías", "d": "Para control de peso, 300 g", "p": 9490}]}]};
const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
