<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Clínica Veterinaria K-Nino</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
h1{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:#8b93a1;font-size:13px;margin-bottom:26px}
.box{background:#14171d;border:1px solid #232833;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#7c8494;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e222b}
.row:last-child{border:0}
.row .n{flex:1;font-size:14px}
input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Clínica Veterinaria K-Nino</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "veterinaria-k-nino", "nombre": "Clínica Veterinaria K-Nino", "tipo": "Veterinaria para gatos", "rating": "3.8", "direccion": "Las Margaritas 1694, La Florida", "telefono": "", "wa_display": "", "minutos": "Recoge hoy", "prioridad": "B", "horarios": {"lun": [9.5, 19.5], "mar": [9.5, 19.5], "mie": [9.5, 19.5], "jue": [9.5, 19.5], "vie": [9.5, 20], "sab": [10, 14.5], "dom": null}, "tema": {"bg": "#0c1210", "card": "#131c18", "acento": "#57b08a", "acento2": "#9adcc0", "texto": "#eef7f2", "fuente": "DM Serif Display", "hero": "https://images.unsplash.com/photo-1450778869180-41d0601e046e?w=1400&q=70"}, "lema": "Medicina veterinaria seria, trato cercano", "categorias": [{"n": "Alimentos felinos", "items": [{"n": "Alimento gato adulto 7,5 kg", "d": "Salmón esterilizado, con taurina", "p": 36690, "tag": "Más pedido"}, {"n": "Alimento gato kitten 2 kg", "d": "Crecimiento, con DHA", "p": 17190}, {"n": "Comida húmeda gato (pack 12)", "d": "Atún, pollo y pescado en salsa", "p": 14990}, {"n": "Snack dental felino", "d": "Masticable, previene sarro", "p": 6190}, {"n": "Leche sin lactosa para gato", "d": "250 ml, tratamiento ocasional", "p": 5090}]}, {"n": "Farmacia felina", "items": [{"n": "Desparasitante interno gato", "d": "Tableta según peso, 1 dosis", "p": 9790, "tag": "Trimestral"}, {"n": "Antipulgas gato (3 dosis)", "d": "Tópico, efecto 3 meses", "p": 17590}, {"n": "Suplemento para riñones", "d": "Pastillas, gatos mayores", "p": 15290}, {"n": "Antiestrés feromónico", "d": "Difusor 30 días", "p": 17390, "tag": "Recomendado"}]}, {"n": "Arena y areneros", "items": [{"n": "Arena aglomerante 10 L", "d": "Bajo en polvo, control de olores", "p": 8890, "tag": "Más pedido"}, {"n": "Arena de sílice 5 kg", "d": "Granulado fino, clásica", "p": 6290}, {"n": "Arenero cubierto", "d": "Con tapa y entrada antiescape", "p": 18390}, {"n": "Bolsas biodegradables (50 u.)", "d": "Para paseos y limpieza", "p": 5490}]}, {"n": "Servicios felinos", "items": [{"n": "Consulta felina", "d": "Manejo bajo estrés, sala tranquila", "p": 20590, "tag": "Turno"}, {"n": "Vacuna triple felina", "d": "Refuerzo anual", "p": 17290}, {"n": "Vacuna antirrábica felina", "d": "Obligatoria, con certificado", "p": 14790, "tag": "Obligatoria"}, {"n": "Esterilización felina", "d": "Incluye prequirúrgico y control", "p": 97390}, {"n": "Baño sin estrés", "d": "Solo para gatos de pelo largo", "p": 17890}]}]};
const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
