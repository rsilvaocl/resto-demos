<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Clínica Veterinaria Lawen</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
h1{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:#8b93a1;font-size:13px;margin-bottom:26px}
.box{background:#14171d;border:1px solid #232833;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#7c8494;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e222b}
.row:last-child{border:0}
.row .n{flex:1;font-size:14px}
input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Clínica Veterinaria Lawen</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "veterinaria-lawen", "nombre": "Clínica Veterinaria Lawen", "tipo": "Clínica veterinaria", "rating": "4.3", "direccion": "Sta. Aurelia 7605, La Florida", "telefono": "", "wa_display": "", "minutos": "Recoge hoy", "prioridad": "A", "horarios": {"lun": [9.5, 19.5], "mar": [9.5, 19.5], "mie": [9.5, 19.5], "jue": [9.5, 19.5], "vie": [9.5, 20], "sab": [10, 14.5], "dom": null}, "tema": {"bg": "#131114", "card": "#1c191d", "acento": "#c4956a", "acento2": "#e6c6a5", "texto": "#f7f1ea", "fuente": "Anton", "hero": "https://images.unsplash.com/photo-1517849845537-4d257902454a?w=1400&q=70"}, "lema": "Farmacia veterinaria y consejo honesto, siempre", "categorias": [{"n": "Alimentos", "items": [{"n": "Alimento perro sensibles 12 kg", "d": "Salmón y papas, sin colorantes", "p": 44390, "tag": "Top"}, {"n": "Alimento gato sterilized 10 kg", "d": "Fórmula completa, con biotina", "p": 41090}, {"n": "Snack de carne seca 500 g", "d": "Cerdo deshidratado, sin conservantes", "p": 8390}, {"n": "Pienso senior perro 12 kg", "d": "Para mayores de 7 años", "p": 37890}, {"n": "Brochetas de atún (pack 6)", "d": "Premio individual para gato", "p": 7190}]}, {"n": "Farmacia", "items": [{"n": "Desparasitante péptico", "d": "Suspensión oral según peso", "p": 11390, "tag": "Mensual"}, {"n": "Antipulgas gato (3 dosis)", "d": "Aplicación tópica, efecto 3 meses", "p": 16990}, {"n": "Protector gástrico", "d": "Pastillas, para perros sensibles", "p": 14890}, {"n": "Omega 3 para pelo y piel", "d": "Cápsulas, 60 unidades", "p": 14390, "tag": "Recomendado"}, {"n": "Suero de rehidratación", "d": "Bolsa 1 litro, con electrolitos", "p": 8390}]}, {"n": "Aseo y accesorios", "items": [{"n": "Baño y corte", "d": "Incluye cepillado y limpieza de oídos", "p": 17390, "tag": "Servicio"}, {"n": "Baño antipulgas", "d": "Shampoo medicado, secado incluido", "p": 23190}, {"n": "Cepillado profundo", "d": "Perros de pelo largo", "p": 12490}, {"n": "Cama antimotines", "d": "Talla S–L, funda lavable", "p": 26090}, {"n": "Correa retráctil 5 m", "d": "Con freno, hasta 50 kg", "p": 11290}]}, {"n": "Servicios clínicos", "items": [{"n": "Consulta general", "d": "Diagnóstico y plan de cuidado", "p": 19690, "tag": "Turno"}, {"n": "Vacuna antirrábica", "d": "Perro o gato, con certificado", "p": 14890, "tag": "Obligatoria"}, {"n": "Vacuna triple felina", "d": "Refuerzo anual", "p": 18390}, {"n": "Vacuna múltiple canina", "d": "Refuerzo anual", "p": 16690}, {"n": "Curación de heridas", "d": "Limpieza y venda incluida", "p": 12690}, {"n": "Colocación de microchip", "d": "Registro e identificación", "p": 21890}, {"n": "Aplicación de inyectables", "d": "Según receta del veterinario", "p": 6690}]}, {"n": "Exámenes y diagnóstico", "items": [{"n": "Análisis de sangre", "d": "Perfil bioquímico completo", "p": 27190}, {"n": "Ecografía abdominal", "d": "Evaluación de órganos", "p": 34590}, {"n": "Radiografía simple", "d": "Una proyección", "p": 26890}, {"n": "Test rápido de enfermedades", "d": "Parvovirus, moquillo, giardia", "p": 18990, "tag": "Rápido"}]}]};
const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
