<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Clínica Veterinaria Nativa</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
h1{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:#8b93a1;font-size:13px;margin-bottom:26px}
.box{background:#14171d;border:1px solid #232833;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#7c8494;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e222b}
.row:last-child{border:0}
.row .n{flex:1;font-size:14px}
input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Clínica Veterinaria Nativa</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "veterinaria-nativa", "nombre": "Clínica Veterinaria Nativa", "tipo": "Clínica veterinaria", "rating": "4.8", "direccion": "Av. Macul 4919, Macul", "telefono": "", "wa_display": "", "minutos": "Recoge hoy", "prioridad": "B", "horarios": {"lun": [9.5, 19.5], "mar": [9.5, 19.5], "mie": [9.5, 19.5], "jue": [9.5, 19.5], "vie": [9.5, 20], "sab": [10, 14.5], "dom": null}, "tema": {"bg": "#12101a", "card": "#1b1826", "acento": "#9d84d9", "acento2": "#cbb7f2", "texto": "#f3f0fa", "fuente": "DM Serif Display", "hero": "https://images.unsplash.com/photo-1518717758536-85ae29035b6d?w=1400&q=70"}, "lema": "Cuidamos a tu perro y a tu gato como si fueran nuestros", "categorias": [{"n": "Alimentos", "items": [{"n": "Alimento natural perro 14 kg", "d": "Ingredientes seleccionados, sin granos", "p": 47490, "tag": "Nuevo"}, {"n": "Alimento gato kitten 2 kg", "d": "Para cachorros de 2 a 12 meses", "p": 15990}, {"n": "Ración húmeda perro (pack 8)", "d": "Carne y vegetales en gelatina", "p": 12590}, {"n": "Premio de pollo deshidratado 300 g", "d": "Snack crocante, ideal para adiestrar", "p": 8290}, {"n": "Agua con sabor para gatos", "d": "Hidratación extra, 500 ml", "p": 6290, "tag": "Recomendado"}]}, {"n": "Farmacia", "items": [{"n": "Desparasitante péptico", "d": "Suspensión oral según peso", "p": 13090, "tag": "Mensual"}, {"n": "Antipulgas gato (3 dosis)", "d": "Aplicación tópica, efecto 3 meses", "p": 18190}, {"n": "Protector gástrico", "d": "Pastillas, para perros sensibles", "p": 12890}, {"n": "Omega 3 para pelo y piel", "d": "Cápsulas, 60 unidades", "p": 14290, "tag": "Recomendado"}, {"n": "Suero de rehidratación", "d": "Bolsa 1 litro, con electrolitos", "p": 8090}]}, {"n": "Aseo y accesorios", "items": [{"n": "Baño y corte", "d": "Incluye cepillado y limpieza de oídos", "p": 17490, "tag": "Servicio"}, {"n": "Baño antipulgas", "d": "Shampoo medicado, secado incluido", "p": 19590}, {"n": "Cepillado profundo", "d": "Perros de pelo largo", "p": 11690}, {"n": "Cama antimotines", "d": "Talla S–L, funda lavable", "p": 24990}, {"n": "Correa retráctil 5 m", "d": "Con freno, hasta 50 kg", "p": 12190}]}, {"n": "Servicios clínicos", "items": [{"n": "Consulta veterinaria", "d": "Examen completo y control general", "p": 20390, "tag": "Turno"}, {"n": "Vacuna múltiple canina", "d": "Primera o refuerzo anual", "p": 18490}, {"n": "Vacuna triple felina", "d": "Refuerzo anual", "p": 16990}, {"n": "Vacuna antirrábica", "d": "Obligatoria, con certificado", "p": 15490, "tag": "Obligatoria"}, {"n": "Esterilización", "d": "Incluye prequirúrgico y control", "p": 131790}, {"n": "Limpieza dental", "d": "Con anestesia y control post", "p": 63690}, {"n": "Corte de uñas", "d": "Incluye revisión de patas", "p": 5590}]}, {"n": "Nutrición y dietas", "items": [{"n": "Consulta de nutrición", "d": "Plan de alimentación según peso", "p": 15590, "tag": "Plan"}, {"n": "Alimento de prescripción renal", "d": "Bolsa 8 kg, con receta", "p": 47090}, {"n": "Alimento de prescripción urinario", "d": "Bolsa 8 kg, con receta", "p": 46990}, {"n": "Snack bajo en calorías", "d": "Para control de peso, 300 g", "p": 9290}]}]};
const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
