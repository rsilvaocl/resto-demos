<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Hospital Veterinario Alto la Florida</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0c0e12;color:#e9ecf1;margin:0;padding:22px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.kick{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
h1{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:#8b93a1;font-size:13px;margin-bottom:26px}
.box{background:#14171d;border:1px solid #232833;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#7c8494;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e222b}
.row:last-child{border:0}
.row .n{flex:1;font-size:14px}
input[type=number]{width:112px;background:#0c0e12;color:#e9ecf1;border:1px solid #2a303c;border-radius:9px;
  padding:8px 10px;font-size:14px;text-align:right;font-family:inherit}
button{background:#3b82f6;color:#fff;border:0;padding:12px 18px;border-radius:11px;font-weight:600;
  font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:#1d222c;color:#c9cfda}
button:active{transform:scale(.98)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ok{color:#34d399;font-size:13px;margin-top:12px;min-height:18px}
</style></head><body><div class="wrap">
<div class="kick">Panel del local</div>
<h1>Hospital Veterinario Alto la Florida</h1>
<div class="sub">Cambie precios y disponibilidad sin depender de nadie.</div>
<div id="app"></div>
<div class="actions">
  <button onclick="guardar()">Guardar cambios</button>
  <button class="sec" onclick="exportar()">Descargar catálogo</button>
  <button class="sec" onclick="location.href='index.html'">Ver catálogo</button>
</div>
<div class="ok" id="ok"></div>
<script>
const DATA = {"slug": "veterinario-alto-la-florida", "nombre": "Hospital Veterinario Alto la Florida", "tipo": "Hospital veterinario 24/7", "rating": "4.0", "direccion": "Av. La Florida, La Florida", "telefono": "", "wa_display": "", "minutos": "24/7", "prioridad": "A", "horarios": {"lun": [0, 24], "mar": [0, 24], "mie": [0, 24], "jue": [0, 24], "vie": [0, 24], "sab": [0, 24], "dom": [0, 24]}, "tema": {"bg": "#151217", "card": "#1f1a22", "acento": "#d98cae", "acento2": "#f0bcd2", "texto": "#f9f1f5", "fuente": "Playfair Display", "hero": "https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=1400&q=70"}, "lema": "Urgencias 24/7: siempre hay alguien para atenderlo", "categorias": [{"n": "Urgencias y estabilización", "items": [{"n": "Triaje de urgencias", "d": "Evaluación inmediata, 24/7", "p": 24190, "tag": "24/7"}, {"n": "Estabilización y sueros", "d": "Líquidos endovenosos", "p": 24490}, {"n": "Oxígeno y nebulización", "d": "Sesión de 30 minutos", "p": 18790}, {"n": "Hospitalización por día", "d": "Incluye monitoreo y sueros", "p": 38290}]}, {"n": "Hospitalización", "items": [{"n": "Internación 24/7", "d": "Enfermería continua, reportes diarios", "p": 49490, "tag": "24/7"}, {"n": "Cirugía de tejidos blandos", "d": "Con anestesia monitorizada", "p": 187290}, {"n": "Recuperación postquirúrgica", "d": "Sala tranquila, visitas acordadas", "p": 16590}, {"n": "Monitoreo constante", "d": "Frecuencia cardiaca y oxígeno", "p": 12890}]}, {"n": "Servicios clínicos", "items": [{"n": "Consulta general", "d": "Diagnóstico y plan de cuidado", "p": 21090, "tag": "Turno"}, {"n": "Vacuna antirrábica", "d": "Perro o gato, con certificado", "p": 15490, "tag": "Obligatoria"}, {"n": "Vacuna triple felina", "d": "Refuerzo anual", "p": 16490}, {"n": "Vacuna múltiple canina", "d": "Refuerzo anual", "p": 17990}, {"n": "Curación de heridas", "d": "Limpieza y venda incluida", "p": 13090}, {"n": "Colocación de microchip", "d": "Registro e identificación", "p": 20490}, {"n": "Aplicación de inyectables", "d": "Según receta del veterinario", "p": 7390}]}, {"n": "Farmacia", "items": [{"n": "Desparasitante péptico", "d": "Suspensión oral según peso", "p": 12490, "tag": "Mensual"}, {"n": "Antipulgas gato (3 dosis)", "d": "Aplicación tópica, efecto 3 meses", "p": 19390}, {"n": "Protector gástrico", "d": "Pastillas, para perros sensibles", "p": 13490}, {"n": "Omega 3 para pelo y piel", "d": "Cápsulas, 60 unidades", "p": 14990, "tag": "Recomendado"}, {"n": "Suero de rehidratación", "d": "Bolsa 1 litro, con electrolitos", "p": 8090}]}]};
const KEY = "admin_"+DATA.slug;
const saved = JSON.parse(localStorage.getItem(KEY)||"null");
if(saved){ DATA.categorias = saved; }
document.getElementById("app").innerHTML = DATA.categorias.map((c,ci)=>`
  <div class="box"><h2>${c.n}</h2>
  ${c.items.map((it,ii)=>`<div class="row">
      <span class="n">${it.n}</span>
      <input type="number" value="${it.p}" step="100" onchange="setP(${ci},${ii},this.value)">
    </div>`).join("")}</div>`).join("");
function setP(ci,ii,v){ DATA.categorias[ci].items[ii].p = Number(v)||0; }
function guardar(){
  localStorage.setItem(KEY, JSON.stringify(DATA.categorias));
  document.getElementById("ok").textContent = "Cambios guardados en este dispositivo ✓";
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = DATA.slug + ".json"; a.click();
}
</script></div></body></html>
